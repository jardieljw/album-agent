name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar Frontend (Vite)
        run: |
          cd frontend-mobile-preview
          npm install
          npm run build
          cd ..

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller playwright pywebview
          python -m playwright install chromium

      - name: Gerar Executável com PyInstaller
        run: |
          python -m PyInstaller --clean --onefile --noconsole --paths . --collect-all src --collect-all webview --collect-all playwright --add-data "frontend-mobile-preview/dist;frontend-mobile-preview/dist" --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan.on src/main.py

      - name: Compactar para ZIP
        run: |
          Compress-Archive -Path dist/main.exe -DestinationPath IMAGEX.AI-Windows.zip

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: IMAGEX.AI-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}